widget_library:
  - class_name: moyu
    id_name: moyu
    order: 0
    name: 开始摸鱼
    icon: fa-solid fa-fish
    icon_color: '#d63130'
    url: http://baidu.com
    background: '#e9e5d1'
    html: '<img class="no-lazy" src="https://api.vvhan.com/api/moyu" style="width:100%">'
  - class_name: daojishi
    id_name: daojishi
    order: 1
    name: 人生倒计时
    icon: fa-solid fa-clock
    icon_color: '#d63130'
    url: http://baidu.com
    background: '#fff'
    html: '<div class="sidebar-box classListBox">
          <div class="aside aside-count">
          <div class="content">
          <div class="item" id="dayProgress">
          <div class="title">今日已经过去<span></span>小时</div>
          <div class="progress">
          <div class="progress-bar">
          <div class="progress-inner progress-inner-1"></div>
          </div>
          <div class="progress-percentage"></div>
          </div>
          </div>
          <div class="item" id="weekProgress">
          <div class="title">这周已经过去<span></span>天</div>
          <div class="progress">
          <div class="progress-bar">
          <div class="progress-inner progress-inner-2"></div>
          </div>
          <div class="progress-percentage"></div>
          </div>
          </div>
          <div class="item" id="monthProgress">
          <div class="title">本月已经过去<span></span>天</div>
          <div class="progress">
          <div class="progress-bar">
          <div class="progress-inner progress-inner-3"></div>
          </div>
          <div class="progress-percentage"></div>
          </div>
          </div>
          <div class="item" id="yearProgress">
          <div class="title">今年已经过去<span></span>个月</div>
          <div class="progress">
          <div class="progress-bar">
          <div class="progress-inner progress-inner-4"></div>
          </div>
          <div class="progress-percentage"></div>
          </div>
          </div>
          </div>
          </div>
          </div>
          <script defer src="/daojishi/daojishi.js"></script>
    <link href="/daojishi/daojishi.css" rel="stylesheet">
          '

widget_library_sticky:
  - class_name: testWidget
    id_name: testWidget
    order: -1
    name: 微博热搜
    icon: fab fa-weibo
    icon_color: '#d63130'
    url: http://baidu.com
    background: '#fff'
    html: '
      <div id="myWeibo">

      <!-- 如果不要滚动，则去掉 vue-seamless-scroll标签就行了，这个插件使用cdn向左向右滚动好像有问题 -->

        <vue-seamless-scroll
          :data="content"
          :class-option="classOption"
          class="warp"
        >
          <div class="weibo-container" v-for="(item, index) in content" :key="index">
            <div class="left">
              <div class="order" :class="{ red: index<=2 }">{{index + 1}}</div>
              <div class="name"><a :href="item.url" target="_blank">{{item.title}}</a></div>
            </div>
            <div class="hot">{{item.hot}}</div>
          </div>
        </vue-seamless-scroll>
      </div>

      <script defer src="/weibo/index.js"></script>
      <link href="/weibo/index.css" rel="stylesheet">
    '
  - class_name: historyToday
    id_name: historyToday
    order: -1
    name: 历史上的今天
    icon: fas fa-calendar-week
    icon_color: '#d63130'
    url: http://baidu.com
    background: '#fff'
    html: '
      <div id="myHistorySwiper" @mouseenter="stopAutoPlay()" @mouseleave="startAutoPlay()">
        <swiper class="myhistoryswiper" ref="myhistoryswiper" style="height:80px;" :options="swiperOption">
          <swiper-slide v-for="(item, index) in content" :key="index">
            {{item.title}}
          </swiper-slide>
        </swiper>
      </div>
      <script defer src="/historyToday/index.js"></script>
    '
  - class_name: testLove
    id_name: testLove
    order: -1
    name: 恋爱墙
    icon: fas fa-heart
    icon_color: '#d63130'
    url: http://baidu.com
    background: '#fff'
    html: '
    
      <div style="text-align: center;">
        <img src="https://pica.zhimg.com/80/v2-377cbc612b5e1d8decc3a70f142176a1_1440w.jpg?source=1940ef5c"
          style="width: 50px;height: 50px;vertical-align: -20px;border-radius: 50%;margin-right: 5px;margin-bottom: 5px;-webkit-box-shadow: 1px 1px 1px rgba(0,0,0,.1), 1px 1px 1px rgba(0,0,0,0.1), 1px 1px 1px rgba(0,0,0,0.1);box-shadow: 1px 1px 1px rgba(0,0,0,.1), 1px 1px 1px rgba(0,0,0,0.1), 1px 1px 1px rgba(0,0,0,0.1);border: 2px solid #fff;" />
